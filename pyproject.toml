[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-finance"
version = "0.1.0"
description = "通用 Agent 平台及证券金融分析应用"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0"
]

[project.scripts]
agent-platform = "agent_platform.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
finance = [
    "akshare>=1.18.64",
    "tushare>=1.4.29",
    "mcp>=1.29,<2"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/agent_platform/deployment.py" = ["S104"]
"src/agent_platform/security.py" = ["S106"]
"Scripts/e2e_dashboard.py" = ["S310", "S603"]
"Scripts/verify_container_restart.py" = ["S310", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["agent_platform"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform = ["resources/*.json", "web/*.html", "web/*.css", "web/*.js"]

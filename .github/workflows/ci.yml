name: project-quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime
        run: python -m pip install --requirement requirements.lock
      - name: Install project
        run: python -m pip install --no-build-isolation --no-deps --editable .
      - name: Compile Python
        run: python -m compileall -q src Scripts tests
      - name: Validate stable delivery commands
        run: |
          agent-platform d2-verify
          agent-platform d3-compare
          agent-platform d4-verify
          agent-platform verify-all
          agent-platform deployment-check
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.lock
      - name: Install quality tools and project
        run: |
          python -m pip install --requirement requirements.lock --requirement requirements-ci.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Ruff lint
        run: >-
          ruff check
          src/agent_platform/security.py src/agent_platform/deployment.py src/agent_platform/p8_acceptance.py
          Scripts/check_secrets.py Scripts/e2e_dashboard.py Scripts/verify_container_restart.py
          tests/test_security.py tests/test_dashboard_security.py tests/test_deployment.py
          tests/test_deployment_artifacts.py tests/test_p8_acceptance.py
      - name: Mypy security and deployment seams
        run: mypy src/agent_platform/security.py src/agent_platform/deployment.py src/agent_platform/p8_acceptance.py
      - name: Coverage gate
        run: |
          coverage run -m unittest discover -s tests
          coverage report --fail-under=60
          coverage xml
      - name: Secret pattern scan
        run: python Scripts/check_secrets.py
      - name: Dependency vulnerability scan
        run: pip-audit --requirement requirements.lock --progress-spinner off
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  browser-e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.lock
      - run: python -m pip install --requirement requirements.lock --requirement requirements-ci.lock
      - run: python -m pip install --no-build-isolation --no-deps --editable .
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Login and role separation in a real browser
        run: python Scripts/e2e_dashboard.py

  container:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root image
        run: docker build --tag agent-platform-finance:p8 .
      - name: Verify image user
        run: test "$(docker run --rm --entrypoint id agent-platform-finance:p8 -u)" != "0"
      - name: Verify persisted job after container restart
        run: python Scripts/verify_container_restart.py --image agent-platform-finance:p8

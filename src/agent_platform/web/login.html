<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="研判 Agent 平台安全登录">
  <title>登录 · 研判 Agent 平台</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-story">
      <a class="login-brand" href="/login"><span>研</span><strong>研判 Agent 平台</strong></a>
      <p class="eyebrow">CONTROLLED RESEARCH ACCESS</p>
      <h1>研究结果与工程后台，<br><em>各自进入自己的门。</em></h1>
      <p class="intro">客户账户查看证券研究与个人工作台；管理员账户进入平台验收、模型治理和安全审计。</p>
      <div class="trust-grid">
        <div><strong>只读研究</strong><span>不连接券商，不创建真实订单</span></div>
        <div><strong>角色隔离</strong><span>客户账户无法进入管理后台</span></div>
        <div><strong>会话密钥</strong><span>DeepSeek Key 只留在当前登录会话</span></div>
      </div>
    </section>
    <section class="login-card" aria-labelledby="login-title">
      <p class="card-kicker">SECURE SIGN IN</p>
      <h2 id="login-title">登录你的工作区</h2>
      <p>首次启动时，账户和随机密码会显示在运行窗口中。</p>
      <form id="login-form">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" maxlength="80" required autofocus>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        <button type="submit">安全登录 <span>→</span></button>
      </form>
      <p class="login-error" id="login-error" role="alert" hidden></p>
      <div class="login-note"><i></i><span>登录状态使用 HttpOnly Cookie；修改操作还需通过 CSRF 校验。</span></div>
    </section>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
